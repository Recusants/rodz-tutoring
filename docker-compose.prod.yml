version: '3.8'

services:
  web:
    image: ${DOCKER_IMAGE_NAME:-rodz-tutoring}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rodz_production_app
    restart: always
    ports:
      - "80:8000"
    env_file:
      - .env.prod
    volumes:
      - rodz_prod_media:/app/media
      - rodz_prod_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rodz_prod_media:
  rodz_prod_data:
