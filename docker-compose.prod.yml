services:
  web:
    image: ${DOCKER_REGISTRY:-yourdockerhubusername}/rodz-tutoring:${TAG:-latest}
    container_name: rodz_production_app
    restart: always
    ports:
      - "${HOST_PORT:-80}:8089"
    env_file:
      - .env.prod
    environment:
      - SQLITE_PATH=/app/data/db.sqlite3
      - PYTHONUNBUFFERED=1
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-0}
    volumes:
      - rodz_prod_media:/app/media
      - rodz_prod_data:/app/data
      - rodz_prod_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  rodz_prod_media:
  rodz_prod_data:
  rodz_prod_logs:
